[package]
name = "pocket-rs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
nucleo-matcher = "0.3"
similar = "2"
syntect = { version = "5", default-features = false, features = ["parsing"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
